<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米xz检测器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1b26 0%, #16161e 50%, #0f0f14 100%);
            color: #a9b1d6;
            padding: 48px 24px;
            line-height: 1.6;
        }
        .wrap {
            max-width: 560px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #c0caf5;
            margin-bottom: 32px;
            letter-spacing: 0.02em;
        }
        .card {
            background: rgba(36, 40, 59, 0.6);
            border: 1px solid rgba(122, 129, 168, 0.15);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-label {
            font-size: 12px;
            font-weight: 500;
            color: #565f89;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }
        #userInput {
            width: 100%;
            min-height: 120px;
            padding: 14px 16px;
            background: rgba(26, 27, 38, 0.8);
            border: 1px solid rgba(122, 129, 168, 0.2);
            border-radius: 8px;
            color: #c0caf5;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #userInput::placeholder { color: #565f89; }
        #userInput:focus {
            outline: none;
            border-color: #7aa2f7;
            box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.15);
        }
        .btn-wrap { margin-top: 20px; }
        #btnSend {
            padding: 12px 28px;
            background: linear-gradient(135deg, #7aa2f7 0%, #5a82d7 100%);
            color: #1a1b26;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #btnSend:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(122, 162, 247, 0.35); }
        #btnSend:active { transform: translateY(0); }
        #btnSend:disabled {
            background: #565f89;
            color: #a9b1d6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .result {
            margin-top: 24px;
            padding: 20px;
            background: rgba(26, 27, 38, 0.8);
            border: 1px solid rgba(122, 129, 168, 0.15);
            border-radius: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 100px;
            font-size: 14px;
            color: #c0caf5;
            line-height: 1.7;
        }
        .result.empty { color: #565f89; }
        .result.error { color: #f7768e; }
        .result .meta { font-size: 12px; color: #565f89; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(122, 129, 168, 0.1); }
        #apiKey {
            width: 100%;
            padding: 12px 16px;
            background: rgba(26, 27, 38, 0.8);
            border: 1px solid rgba(122, 129, 168, 0.2);
            border-radius: 8px;
            color: #c0caf5;
            font-size: 14px;
            font-family: inherit;
        }
        #apiKey::placeholder { color: #565f89; }
        #apiKey:focus {
            outline: none;
            border-color: #7aa2f7;
            box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.15);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>米孝子检测</h1>

        <div class="card">
            <div class="card-label">DeepSeek API Key</div>
            <input type="password" id="apiKey" placeholder="请输入你的 DeepSeek API Key（sk-...）" autocomplete="off">
        </div>

        <div class="card">
            <div class="card-label">输入</div>
            <textarea id="userInput" placeholder="随便输入一段话，检测你是不是米孝子"></textarea>
            <div class="btn-wrap">
                <button id="btnSend">发送</button>
            </div>
        </div>

        <div class="result empty" id="result"></div>
    </div>

    <script>
        (function () {
            // DeepSeek 官方 API 地址（OpenAI 兼容格式）
            var DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';
            var SYSTEM_PROMPT = '【角色】你是“原神关联判定员”，知道各种关于原神的梗和游戏内容，根据用户输入判断其与《原神》/米哈游的关联程度。\n【规则】① 尽可能把用户的话往原神/米哈游方向联想（如含“原”可联想原神）；无法关联则直接放弃，过程不能凭空创造没有的内容。② 关联越强“米味”越重。③ 先写简短推理过程，再给结论：米孝子 / 路人 / 米黑。④ 语气尖锐，总回复严格控制在100字以内。';

            var apiKeyInput = document.getElementById('apiKey');
            var userInput = document.getElementById('userInput');
            var btnSend = document.getElementById('btnSend');
            var result = document.getElementById('result');

            function setResult(text, isError) {
                var hasMeta = text && text.indexOf('（消耗 token:') !== -1;
                var main = text || '';
                var meta = '';
                if (hasMeta) {
                    var i = text.lastIndexOf('\n\n');
                    if (i !== -1) { main = text.slice(0, i); meta = text.slice(i).trim(); }
                }
                result.innerHTML = main
                    ? (main + (meta ? '<span class="meta">' + meta + '</span>' : ''))
                    : '回复将显示在这里';
                result.classList.toggle('empty', !main);
                result.classList.remove('error');
                if (isError) result.classList.add('error');
            }

            btnSend.addEventListener('click', function () {
                var key = (apiKeyInput.value || '').trim();
                var text = (userInput.value || '').trim();

                if (!key) { setResult('请先输入 DeepSeek API Key', true); return; }
                if (!text) { setResult('请输入内容', true); return; }

                btnSend.disabled = true;
                setResult('请求中...', false);

                var messages = [{ role: 'user', content: text }];
                if (SYSTEM_PROMPT) {
                    messages.unshift({ role: 'system', content: SYSTEM_PROMPT });
                }
                var payload = {
                    model: 'deepseek-chat',
                    messages: messages
                };

                fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify(payload)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (json) {
                        if (json.choices && json.choices.length > 0) {
                            var content = (json.choices[0].message && json.choices[0].message.content) || '';
                            var meta = '';
                            if (json.usage && json.usage.total_tokens != null) {
                                meta = '（消耗 token: ' + json.usage.total_tokens + '）';
                            }
                            setResult(content + (meta ? '\n\n' + meta : ''), false);
                        } else if (json.error) {
                            setResult('API 错误: ' + (json.error.message || json.error.code || '未知错误'), true);
                        } else {
                            setResult('错误: 无法解析回复', true);
                        }
                    })
                    .catch(function (err) {
                        setResult('请求失败: ' + (err.message || String(err)), true);
                    })
                    .finally(function () { btnSend.disabled = false; });
            });
        })();
    </script>
</body>
</html>
