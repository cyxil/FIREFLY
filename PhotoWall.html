<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流萤 · 照片墙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Georgia', serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8e8f0 30%, #fff0f5 60%, #fce4ec 100%);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: '❤';
            position: fixed;
            top: 20px;
            left: 40px;
            font-size: 28px;
            color: rgba(244, 143, 177, 0.3);
            animation: floatHeart 6s ease-in-out infinite;
        }

        body::after {
            content: '❤';
            position: fixed;
            bottom: 40px;
            right: 40px;
            font-size: 36px;
            color: rgba(244, 143, 177, 0.25);
            animation: floatHeart 8s ease-in-out infinite reverse;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.6; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-size: 2.2em;
            color: #c2185b;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 2px 12px rgba(244, 143, 177, 0.4);
        }

        .subtitle {
            color: #e91e63;
            font-size: 0.95em;
            margin-top: 6px;
            opacity: 0.7;
            letter-spacing: 6px;
        }

        #masonry-container {
            column-count: 4;
            column-gap: 16px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 16px rgba(233, 30, 99, 0.10);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            position: relative;
        }

        .photo-item:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 12px 30px rgba(233, 30, 99, 0.18);
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .photo-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
            pointer-events: none;
        }

        .photo-item:hover::after {
            border-color: rgba(233, 30, 99, 0.25);
        }

        .photo-item .hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 15px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: 14px;
        }

        .photo-item:hover .hint {
            opacity: 1;
        }

        @media (hover: none) and (pointer: coarse) {
            .photo-item .hint {
                inset: auto 0 0 0;
                height: 32px;
                font-size: 12px;
                letter-spacing: 1px;
                background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
                border-radius: 0 0 14px 14px;
                opacity: 1;
                align-items: flex-end;
                padding-bottom: 6px;
            }
        }

        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #e91e63;
            font-size: 18px;
            letter-spacing: 2px;
        }

        #loading::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-left: 10px;
            border: 2px solid #f48fb1;
            border-top-color: #c2185b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        #loading[data-done]::after {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
        }

        #modal.active {
            display: flex;
        }

        #modal img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(233, 30, 99, 0.25), 0 0 80px rgba(0, 0, 0, 0.4);
        }

        #modal .close {
            position: fixed;
            top: 24px;
            right: 32px;
            color: #f8bbd0;
            font-size: 42px;
            font-weight: normal;
            cursor: pointer;
            line-height: 1;
            z-index: 1001;
            user-select: none;
            transition: color 0.3s ease, transform 0.3s ease;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(233, 30, 99, 0.15);
        }

        #modal .close:hover {
            color: #fff;
            background: rgba(233, 30, 99, 0.35);
            transform: rotate(90deg);
        }

        @media (max-width: 1024px) {
            #masonry-container { column-count: 3; }
        }

        @media (max-width: 768px) {
            #masonry-container { column-count: 2; column-gap: 12px; }
            .photo-item { margin-bottom: 12px; }
            h1 { font-size: 1.6em; }
            .subtitle { font-size: 0.8em; }
        }

        @media (max-width: 480px) {
            #masonry-container { column-count: 1; }
            body { padding: 15px 10px; }
            h1 { font-size: 1.3em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-icon">&#x1F497;</span>
        <h1>流萤 · 照片墙</h1>
        <!-- <div class="subtitle">— 与你共度的每一帧 —</div> -->
    </div>

    <div id="masonry-container"></div>

    <div id="loading">正在加载</div>

    <div id="modal">
        <span class="close">&times;</span>
        <img id="modal-image" alt="大图预览">
    </div>

    <script src="PhotoWall/images.js"></script>
    <script>
        (function () {
            var container = document.getElementById('masonry-container');
            var loading = document.getElementById('loading');

            if (typeof PHOTO_IMAGES === 'undefined' || !PHOTO_IMAGES.length) {
                loading.textContent = '暂无图片';
                return;
            }

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
                }
                return arr;
            }

            var shuffled = shuffle(PHOTO_IMAGES.slice());

            var modal = document.getElementById('modal');
            var modalImg = document.getElementById('modal-image');
            var closeBtn = modal.querySelector('.close');

            function openModal(src) {
                modalImg.src = src;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('active');
                modalImg.src = '';
                document.body.style.overflow = '';
            }

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
            });

            var BATCH_SIZE = 10;
            var loadedIndex = 0;
            var isLoading = false;
            var allLoaded = false;

            function createPhotoItem(file) {
                var item = document.createElement('div');
                item.className = 'photo-item';

                var img = document.createElement('img');
                img.src = 'PhotoWall/thumbs/' + file;
                img.alt = file;
                img.dataset.original = 'PhotoWall/' + file;

                img.addEventListener('click', function () {
                    openModal(this.dataset.original);
                });

                var hint = document.createElement('div');
                hint.className = 'hint';
                hint.textContent = '点击查看原图';

                item.appendChild(img);
                item.appendChild(hint);
                return item;
            }

            function loadNextBatch() {
                if (isLoading || allLoaded) return;
                isLoading = true;

                var end = Math.min(loadedIndex + BATCH_SIZE, shuffled.length);
                for (var i = loadedIndex; i < end; i++) {
                    container.appendChild(createPhotoItem(shuffled[i]));
                }
                loadedIndex = end;

                if (loadedIndex >= shuffled.length) {
                    allLoaded = true;
                    loading.textContent = '已加载全部 ✿';
                    loading.dataset.done = 'true';
                    if (observer) observer.disconnect();
                    isLoading = false;
                    return;
                }

                loading.textContent = '滚动加载更多';
                delete loading.dataset.done;
                isLoading = false;

                var rect = loading.getBoundingClientRect();
                if (rect.top <= window.innerHeight) {
                    requestAnimationFrame(loadNextBatch);
                }
            }

            var observer = new IntersectionObserver(function (entries) {
                if (entries[0].isIntersecting) {
                    loadNextBatch();
                }
            }, { rootMargin: '200px' });

            observer.observe(loading);
        })();
    </script>

</body>
</html>
